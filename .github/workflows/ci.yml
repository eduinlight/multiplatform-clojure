name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clojure:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.2
        env:
          MONGO_INITDB_ROOT_USERNAME: app
          MONGO_INITDB_ROOT_PASSWORD: app
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@v13
        with:
          cli: latest
          clj-kondo: latest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-deps-${{ hashFiles('**/deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: lint
        run: clj-kondo --lint apps packages

      - name: format check
        run: clojure -M:cljfmt check apps packages deps.edn

      - name: api tests
        working-directory: apps/api
        env:
          MONGODB_URI: mongodb://app:app@localhost:27017/?authSource=admin
        run: clojure -M:test

  api-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api-sdk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@v13
        with:
          cli: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-sdk-${{ hashFiles('**/deps.edn') }}
          restore-keys: ${{ runner.os }}-sdk-

      - name: jvm tests
        run: clojure -M:test

      - name: node tests
        run: |
          clojure -M:cljs-test -m shadow.cljs.devtools.cli compile test
          node target/node-test.js

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@v13
        with:
          cli: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-app-${{ hashFiles('**/deps.edn') }}
          restore-keys: ${{ runner.os }}-app-

      - name: node tests
        run: |
          npm install --no-audit --no-fund
          clojure -M:cljs-test -m shadow.cljs.devtools.cli compile test
          node target/node-test.js

  cljs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, mobile]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@v13
        with:
          cli: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            apps/${{ matrix.app }}/.shadow-cljs
          key: ${{ runner.os }}-cljs-${{ matrix.app }}-${{ hashFiles('**/deps.edn') }}
          restore-keys: ${{ runner.os }}-cljs-${{ matrix.app }}-

      - name: install js deps
        working-directory: apps/${{ matrix.app }}
        run: npm install --no-audit --no-fund

      - name: release build
        working-directory: apps/${{ matrix.app }}
        run: npx shadow-cljs release app

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build production api image
        run: docker build -f apps/api/Dockerfile -t app-api:ci .
